<!doctype html>
<html lang="vi">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Góc học Minhhuong</title
  ><link rel="stylesheet" href="style.css" />
  <body>
    <main>
      <span class="badge">MINHHUONG · GÓC HỌC CỦA CON</span>
      <h1>Mình cùng khám phá điều mới nhé!</h1>
      <p>
        Trang này chưa có trong danh sách của con hoặc con đã hết thời gian xem.
        Con có thể chọn một hoạt động dưới đây.
      </p>
      <p id="status" role="status"></p>
      <div id="items"></div>
      <button id="refresh">Thử lại</button
      ><small
        >Khi mất mạng, nội dung học trực tuyến cần đợi kết nối trở lại. Con có
        thể nghỉ mắt và kể cho bố mẹ điều vừa học.</small
      >
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
