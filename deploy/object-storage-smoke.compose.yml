services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UPLOAD_S3_ACCESS_KEY_ID:?synthetic access key required}
      MINIO_ROOT_PASSWORD: ${UPLOAD_S3_SECRET_ACCESS_KEY:?synthetic secret key required}
    volumes:
      - object-storage-data:/data
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PUBLISHED_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - app
      - data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${UPLOAD_S3_ACCESS_KEY_ID:?synthetic access key required}
      MINIO_ROOT_PASSWORD: ${UPLOAD_S3_SECRET_ACCESS_KEY:?synthetic secret key required}
      UPLOAD_S3_BUCKET: ${UPLOAD_S3_BUCKET:?synthetic bucket required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$UPLOAD_S3_BUCKET"
        mc anonymous set none "local/$$UPLOAD_S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data

  migrate:
    environment:
      UPLOAD_S3_ENDPOINT: http://minio:9000
      UPLOAD_S3_FORCE_PATH_STYLE: "true"
      UPLOAD_S3_LOCAL_SMOKE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  api:
    environment:
      UPLOAD_S3_ENDPOINT: http://minio:9000
      UPLOAD_S3_FORCE_PATH_STYLE: "true"
      UPLOAD_S3_LOCAL_SMOKE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  object-storage-data:
