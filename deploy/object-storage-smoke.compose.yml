services:
  minio:
    # minio/minio and minio/mc were removed from Docker Hub; pgsty/minio is a
    # community fork with the same server CLI and an `mc` binary on PATH.
    image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UPLOAD_S3_ACCESS_KEY_ID:?synthetic access key required}
      MINIO_ROOT_PASSWORD: ${UPLOAD_S3_SECRET_ACCESS_KEY:?synthetic secret key required}
    volumes:
      - object-storage-data:/data
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PUBLISHED_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - app
      - data

  minio-init:
    image: *minio-image
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${UPLOAD_S3_ACCESS_KEY_ID:?synthetic access key required}
      MINIO_ROOT_PASSWORD: ${UPLOAD_S3_SECRET_ACCESS_KEY:?synthetic secret key required}
      UPLOAD_S3_BUCKET: ${UPLOAD_S3_BUCKET:?synthetic bucket required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$UPLOAD_S3_BUCKET"
        mc anonymous set none "local/$$UPLOAD_S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data

  migrate:
    environment:
      UPLOAD_S3_ENDPOINT: http://minio:9000
      UPLOAD_S3_FORCE_PATH_STYLE: "true"
      UPLOAD_S3_LOCAL_SMOKE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  api:
    environment:
      UPLOAD_S3_ENDPOINT: http://minio:9000
      UPLOAD_S3_FORCE_PATH_STYLE: "true"
      UPLOAD_S3_LOCAL_SMOKE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  object-storage-data:
