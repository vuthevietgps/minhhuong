name: hosted-staging-verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://contract:contract@postgres.invalid:5432/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm run test:scripts
      - run: npm run check:file-length
      - run: npm ci --prefix apps/api
      - run: npm ci --prefix apps/web
      - run: npm run prisma:generate
      - run: npm run verify:deployment
      - run: npm --prefix apps/api run test -- health.controller.spec.ts learning-local-demo.production-runtime-safety.spec.ts auth-session-store.provider.spec.ts auth-operational-control.provider.spec.ts auth-operational-alert-state.provider.spec.ts --runInBand
      - run: npm run seed:demo
      - run: npm run report:demo
      - run: npm run test:learning-local
      - run: npm run build
      - run: npm run smoke:hosted-staging
